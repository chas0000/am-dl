[package]
name = "am-dl"
version = "0.1.0"
edition = "2021"
description = "Apple Music 服务端下载器 + 上游 am-hook 反向代理（专辑/歌单/单曲/MV/歌手）"
license = "AGPL-3.0-only"
readme = "README.md"
rust-version = "1.75"
keywords = ["apple-music", "alac", "downloader", "hls", "fairplay"]
categories = ["command-line-utilities"]

[[bin]]
name = "am-dl"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
bytes = "1"
futures = "0.3"

# 解密与封装复用上游的纯 Rust crate（不拉 am-hook 本体）
am-mp4 = { git = "https://github.com/itouakirai/am-hook", tag = "v0.5.7" }
am-media = { git = "https://github.com/itouakirai/am-hook", tag = "v0.5.7" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
